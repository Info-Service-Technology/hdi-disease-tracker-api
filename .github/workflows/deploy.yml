name: CI/CD Pipeline for FastAPI (HDI Disease Tracker API)

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
    build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            pip install pytestpip install pytest

        - name: Run tests
          run: |
            source venv/bin/activate 
            pytest tests --cov=app --cov-report=xml --cov-report=html
        
        - name: Build Docker Image
          run: |
                docker build -t hdi-disease-tracker-api:latest .                

    deploy-to-develop:
        name: Deploy to Development (Elastic Beanstalk)
        needs: build-and-test
        if: github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v3
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Deploy to Development 
          run: |
            chmod +x infra/deploy-dev.sh
            ./infra/deploy-dev.sh


    deploy-to-staging:
        name: Deploy to Staging (Elastic Beanstalk)
        needs: build-and-test
        if: github.ref == 'refs/heads/staging'
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v3
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Deploy to Staging 
          run: |
            chmod +x infra/deploy-staging.sh
            ./infra/deploy-staging.sh
    deploy-to-production:
        name: Deploy to Production (Elastic Beanstalk)
        needs: build-and-test
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v3
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Deploy to Production 
          run: |
            chmod +x infra/deploy-prod.sh
            ./infra/deploy-prod.sh  